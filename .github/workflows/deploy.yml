name: Deploy to Hostinger Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Step 2: Set up Node.js with caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run Linter (Ensures Code Quality)
      - name: Run Linter
        run: npm run lint

      # Step 5: Build Next.js Static Export
      - name: Build Next.js Static Production Export
        run: npm run build

      # Step 6: Ensure .htaccess is included in static export
      - name: Copy .htaccess to out folder
        run: cp public/.htaccess out/.htaccess

      # Step 7: Verify Build Artifacts
      - name: Verify Export Output
        run: |
          if [ ! -f "out/index.html" ]; then
            echo "::error::Build verification failed! out/index.html was not generated."
            exit 1
          fi
          echo "Build verified successfully. Files ready for deployment:"
          ls -la out/

      # Step 7: Deploy to Hostinger via Secure FTP
      - name: Deploy to Hostinger via Direct FTP
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_PASSWORD }}
          FTP_PORT: ${{ secrets.HOSTINGER_PORT || 21 }}
          FTP_DIR: ${{ secrets.HOSTINGER_SERVER_DIR || 'public_html' }}
        run: |
          node -e '
          const ftp = require("basic-ftp");
          async function upload() {
            const client = new ftp.Client();
            client.ftp.verbose = true;
            try {
              console.log("Connecting to Hostinger FTP server...");
              await client.access({
                host: process.env.FTP_HOST,
                user: process.env.FTP_USER,
                password: process.env.FTP_PASS,
                port: parseInt(process.env.FTP_PORT || "21"),
                secure: false
              });
              console.log("Connected successfully. Uploading out/ to " + process.env.FTP_DIR + "...");
              await client.uploadFromDir("out", process.env.FTP_DIR);
              console.log("🎉 All files deployed successfully to Hostinger!");
            } catch (err) {
              console.error("FTP Deployment Error:", err);
              process.exit(1);
            } finally {
              client.close();
            }
          }
          upload();
          '

